version: 2
builds:
  - main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
dockers:
  - image_templates:
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}"
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}-amd64"
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}-arm64"
      - "ghcr.io/liuyie/ddns-go:latest"
    dockerfile: ./Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
    platforms:
      - linux/amd64
      - linux/arm64
release:
  github:
    release_name: "{{ .Tag }}"
checksum:
  name_template: 'checksums.txt'
