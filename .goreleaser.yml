version: 2
builds:
  - main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
dockers:
  - image_templates:
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}-amd64"
    dockerfile: ./Dockerfile
    use: buildx
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
  - image_templates:
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}-arm64"
    dockerfile: ./Dockerfile
    use: buildx
    goarch: arm64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
docker_manifests:
  - name_template: "ghcr.io/liuyie/ddns-go:{{ .Tag }}"
    image_templates:
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}-amd64"
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/liuyie/ddns-go:latest"
    image_templates:
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}-amd64"
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}-arm64"
release:
  github:
    name_template: "{{ .Tag }}"
checksum:
  name_template: 'checksums.txt'
