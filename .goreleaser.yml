# .goreleaser.yaml
version: 2

builds:
  - main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

archives:
  - format: tar.gz
    # windows打包为zip
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

dockers_v2:
  - images:
      - ghcr.io/liuyie/ddns-go
    dockerfile: ./Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    image_templates:
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}"
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}-amd64"
      - "ghcr.io/liuyie/ddns-go:{{ .Tag }}-arm64"
      - "ghcr.io/liuyie/ddns-go:latest"
    build_flag_templates:
      - "--pull"

release:
  github:
    draft: false
    prerelease: false

checksum:
  name_template: 'checksums.txt'
