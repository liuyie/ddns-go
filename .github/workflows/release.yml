on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（必须 v 开头，例：v6.17.8）'
        type: string
        required: true
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  packages: write
jobs:
  goreleaser:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare tag (manual dispatch)
        id: prep-tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=${{ github.event.inputs.version }}
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "❌ 版本号必须以 v 开头，例如 v6.17.7"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "❌ Tag $VERSION 已经存在，不能重复发布"
            exit 1
          fi
          git config --global user.name "liuyie"
          git config --global user.email "liuyie@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "OVERRIDE_REF=refs/tags/$VERSION" >> $GITHUB_ENV
      - name: Override GITHUB_REF for goreleaser
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "GITHUB_REF=${{ env.OVERRIDE_REF }}" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
